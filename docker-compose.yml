x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME}
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.12.6 dbt-clickhouse==1.10.3"
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch_admin}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./config:/opt/airflow/config
    - ./dbt:/opt/airflow/dbt
  user: "${AIRFLOW_UID}:0"
  depends_on:
    postgres:
      condition: service_healthy
    clickhouse:
      condition: service_healthy

services:        
  metabase:
    image: metabase/metabase:v0.54.4
    container_name: de_metabase
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TOOL_OPTIONS=-Xmx512m -Xms256m -XX:+UseG1GC -XX:MaxGCPauseMillis=100
    volumes:
      - /data/platform/metabase_data:/metabase-data
    deploy:
      resources:
        limits:
          cpus: '0.60'
          memory: 768M
          
  postgres:
    image: postgres:16-alpine
    container_name: de_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
  
  minio:
    image: cleanstart/minio:latest
    container_name: de_minio
    user: "0:0"
    # command: -c 'minio server /data --console-address ":9001"'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always

  redpanda:
    image: redpandadata/redpanda:latest
    container_name: de_redpanda
    command: redpanda start --smp 1 --memory 512M --reserve-memory 0M --overprovisioned --node-id 0 --check=false --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092 --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://192.168.2.189:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
      - "9644:9644"
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: de_airflow_init
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
        --username ${_AIRFLOW_WWW_USER_USERNAME}
        --firstname Admin
        --lastname DataOps
        --role Admin
        --email admin@example.com
        --password ${_AIRFLOW_WWW_USER_PASSWORD} || true
      "

  airflow-webserver:
    <<: *airflow-common
    container_name: de_airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  
  airflow-scheduler:
    <<: *airflow-common
    container_name: de_airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: de_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: lakehouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-ch_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?ClickHouse password is required}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"  # HTTP Interface (dbt, S3 engine, Ping)
      - "9010:9000"  # Native TCP Interface (clickhouse-client, ETL)
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1024M
    expose:
      - "9363"    
    volumes:
      - /data/clickhouse/data:/var/lib/clickhouse
      - /data/clickhouse/logs:/var/log/clickhouse-server
      - /data/clickhouse/config.d/tuning.xml:/etc/clickhouse-server/config.d/tuning.xml:ro
      - /data/clickhouse/config.d/named_collections.xml:/etc/clickhouse-server/config.d/named_collections.xml:ro
      - /data/clickhouse/users.d/resource_limits.xml:/etc/clickhouse-server/users.d/resource_limits.xml:ro
      - /data/clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: de_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: de_prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.wal-compression'
      - '--storage.tsdb.min-block-duration=2h'
      - '--storage.tsdb.max-block-duration=2h'
      - '--web.enable-lifecycle'
    volumes:
      - /data/platform/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/platform/monitoring/prometheus/data:/prometheus
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M

  grafana:
    image: grafana/grafana:11.2.0
    container_name: de_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - /data/platform/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - /data/platform/monitoring/grafana/data:/var/lib/grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 256M
  
  producer:
    build:
      context: ./services/producer
      dockerfile: Dockerfile
    container_name: de_producer
    restart: unless-stopped
    depends_on:
      - redpanda
    environment:
      BOOTSTRAP_SERVERS: "redpanda:29092"
      TOPIC_NAME: "transactions"
      TARGET_RPS: 1000
      BATCH_BURST: 50
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    networks:
      - default

  consumer:
      build:
        context: ./services/consumer
        dockerfile: Dockerfile
      container_name: de_consumer
      restart: unless-stopped
      depends_on:
        - redpanda
        - minio
      environment:
        BOOTSTRAP_SERVERS: "redpanda:29092"
        TOPIC_NAME: "transactions"
        CONSUMER_GROUP: "lakehouse-bronze-consumer"
        BATCH_SIZE: 30000
        FLUSH_INTERVAL_SEC: 30
        S3_ENDPOINT_URL: "http://minio:9000"
        S3_ACCESS_KEY: "minioadmin"
        S3_SECRET_KEY: "minioadmin_secure_pass"
        S3_BUCKET_NAME: "lakehouse"
      deploy:
        resources:
          limits:
            cpus: '0.75'
            memory: 512M
      networks:
        - default

volumes:
  postgres_data:
  minio_data:
  redpanda_data:
